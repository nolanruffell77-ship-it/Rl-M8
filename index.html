<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RL M8 Finder</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0d17;color:#f5f4ff;font:16px system-ui}header,main{max-width:1100px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #303047}h1{font-size:clamp(36px,7vw,76px);line-height:1;font-style:italic;margin:20px 0}em{color:#ae91ff}section{padding:24px;background:#151827;border:1px solid #303047;border-radius:16px;margin:18px 0}.hero{background:radial-gradient(at top right,#493080,transparent 70%),#151827}button,input,select,textarea{font:inherit;border-radius:8px;padding:10px;border:1px solid #42445e;background:#101321;color:white}button{background:#7950ed;border:0;cursor:pointer;font-weight:bold}label{display:grid;gap:5px;color:#c4c3d9}form,.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.filters{display:flex;flex-wrap:wrap;gap:8px}.stats{display:flex;gap:25px}.stats b{display:block;font-size:26px;color:#b49aff}small,p{color:#b7b7ce}a{color:#b49aff}article{background:#101321;padding:18px;border-radius:12px}button.secondary{background:#34344c}[hidden]{display:none!important}</style><header><strong>RL<em>M8</em> FINDER</strong><button id="join">Créer mon profil</button></header><main><section class="hero"><small>ROCKET LEAGUE / LFG</small><h1>TROUVE TON M8.<br><em>ATTEINS TON PEAK.</em></h1><p>Le bon duo. Le même objectif. Un nouveau peak.</p><button onclick="document.getElementById('search').scrollIntoView()">Trouver un mate</button></section><section id="signup" hidden><h2>Mon profil</h2><form id="form"><label>Pseudo de jeu<input name="pseudo" required maxlength="30"></label><label>Lien Tracker<input name="tracker" type="url" required placeholder="https://rocketleague.tracker.network/..."></label><label>Rank<select name="rank" class="ranks"></select></label><label>MMR actuel<input name="mmr" type="number" min="0" max="4000" required></label><label>Peak MMR<input name="peak" type="number" min="0" max="4000" required></label><label>Mode<select name="mode"><option>2v2</option><option>3v3</option></select></label><label>Objectif<select name="goal" class="goals"></select></label><label>Rank recherché<select name="wanted" class="ranks"></select></label><label>Région<select name="region"><option>EU</option><option>NA</option><option>Autre</option></select></label><label>Style<select name="style"><option>Teamplay</option><option>Polyvalent</option><option>Offensif</option><option>Défensif</option></select></label><label>Ce que je recherche<textarea name="bio" maxlength="200" placeholder="Objectifs de jeu uniquement, sans informations personnelles"></textarea></label><button>Enregistrer mon profil local</button></form><p>Statistiques manuelles, non vérifiées. <a href="https://rocketleague.tracker.network/" target="_blank" rel="noopener">Ouvrir Tracker</a></p><button class="secondary" id="remove">Supprimer mon profil local</button></section><section id="search"><h2>Recherche de mates</h2><p>Mode démo : joueurs fictifs, aucune mise en relation réelle.</p><div class="filters"><select id="rank" class="ranks" data-all="Tous les ranks"></select><select id="mode"><option value="">Tous les modes</option><option>2v2</option><option>3v3</option></select><select id="goal" class="goals" data-all="Tous les objectifs"></select><input id="min" type="number" placeholder="MMR min" min="0"><input id="max" type="number" placeholder="MMR max" min="0"><label><input id="only" type="checkbox"> Favoris</label></div><p id="count"></p><div class="grid" id="cards"></div></section></main><script>const $=id=>document.getElementById(id), ranks=['Bronze','Argent','Or','Platine','Diamant','Champion','Grand Champion','SSL'],goals=['Grind','Tryhard','Chill','Tournois','Compétitif'];document.querySelectorAll('.ranks,.goals').forEach(s=>{if(s.dataset.all)s.add(new Option(s.dataset.all,''));(s.classList.contains('ranks')?ranks:goals).forEach(v=>s.add(new Option(v,v)))});const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));let me=read('profile',null),fav=read('favorites',[]);const demo=[['ZenithRL','Grand Champion',1532,1680,'2v2','Tryhard'],['Nexora','Champion',1285,1390,'2v2','Grind'],['AstraRL','SSL',1904,2050,'3v3','Tournois'],['Frosty','Diamant',1010,1130,'2v2','Chill']].map(([pseudo,rank,mmr,peak,mode,goal])=>({pseudo,rank,mmr,peak,mode,goal,region:'EU',style:'Teamplay',wanted:rank}));const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function score(p){return Math.round(40*Math.max(0,1-Math.abs(p.mmr-me.mmr)/500)+25*(p.mode===me.mode)+15*(p.goal===me.goal)+10*(p.rank===me.wanted)+10*(p.region===me.region))}function render(){let a=demo.filter(p=>(!$('rank').value||p.rank===$('rank').value)&&(!$('mode').value||p.mode===$('mode').value)&&(!$('goal').value||p.goal===$('goal').value)&&(!$('min').value||p.mmr>=+$('min').value)&&(!$('max').value||p.mmr<=+$('max').value)&&(!$('only').checked||fav.includes(p.pseudo)));if(me)a.sort((x,y)=>score(y)-score(x));$('count').textContent=a.length+' profils fictifs';$('cards').innerHTML=a.map(p=>`<article><small>◇ ${esc(p.rank)} · ${p.region}</small><h3>${esc(p.pseudo)}</h3><div class="stats"><div>MMR<b>${p.mmr}</b></div><div>PEAK<b>${p.peak}</b></div></div><p>${p.mode} · ${p.goal} · ${p.style}</p><p>Recherche : ${p.wanted}</p>${me?`<p>Compatibilité indicative : ${score(p)} %</p>`:''}<button data-p="${p.pseudo}">${fav.includes(p.pseudo)?'★ Retirer':'☆ Favori'}</button></article>`).join('');$('cards').querySelectorAll('button').forEach(b=>b.onclick=()=>{let p=b.dataset.p;fav=fav.includes(p)?fav.filter(x=>x!==p):[...fav,p];save('favorites',fav);render()})}function edit(){ $('signup').hidden=false;if(me)Object.entries(me).forEach(([k,v])=>{if($('form').elements[k])$('form').elements[k].value=v});$('signup').scrollIntoView()}$('join').onclick=edit;$('form').onsubmit=e=>{e.preventDefault();let p=Object.fromEntries(new FormData(e.target));let u=new URL(p.tracker);if(u.protocol!=='https:'||u.hostname!=='rocketleague.tracker.network'||+p.peak<+p.mmr){alert('Vérifie le lien Tracker et le peak MMR.');return}me=p;save('profile',me);$('signup').hidden=true;$('join').textContent='Mon profil';render()};$('remove').onclick=()=>{me=null;localStorage.removeItem('profile');$('form').reset();$('join').textContent='Créer mon profil';$('signup').hidden=true;render()};if(me)$('join').textContent='Mon profil';['rank','mode','goal','min','max','only'].forEach(k=>$(k).oninput=render);render();</script></html>
